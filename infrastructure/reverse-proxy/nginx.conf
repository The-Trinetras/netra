# nginx template (the official image renders /etc/nginx/templates/*.template
# with envsubst; compose limits substitution to NETRA_* variables).
# TLS terminates here; the API listens only on the compose network.
# Credentials travel in the Authorization header, never in URLs, and the
# default access log format records neither headers nor request bodies.

server {
    listen 80;
    listen [::]:80;
    server_name ${NETRA_TLS_DOMAIN};

    # Let's Encrypt HTTP-01 challenges (certbot writes into /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${NETRA_TLS_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${NETRA_TLS_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NETRA_TLS_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # Matches the approved maximum upload size (D-UPLOAD-SIZE).
    client_max_body_size ${NETRA_UPLOAD_MAX_BODY};

    # Telemetry counters are for operators on the host, not the internet.
    location = /health/telemetry {
        deny all;
    }

    # Protocol v1 WebSocket: long-lived, upgraded connection.
    location = /v1/ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }
}
