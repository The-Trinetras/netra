[pytest]
# The one pytest configuration for the whole repository. pytest.ini takes
# precedence over pyproject.toml, so nothing about pytest lives there.

# Every Python test root. "tests/" holds the agentic-slice-kit suites
# (spine, smoke, notes slice) and Netra's cross-cutting acceptance/contract
# suites; the per-deployable suites live beside the code they cover. Keep
# "tests" last: the kit's tests load .env at import time (conftest.py
# isolates each test from it).
testpaths = api/tests worker/tests evaluation/scripts tests

# "." makes the kit packages (slice, demo, web) importable. Netra's root
# manifest declares an environment, not a distributable package, so
# netra_api/netra_worker are not installed into site-packages; their src
# roots here make them resolve without an install step.
pythonpath = . api/src worker/src

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
addopts = -m "not integration"
markers =
    integration: requires an explicitly available external or local infrastructure service
