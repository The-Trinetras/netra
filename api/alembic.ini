[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# Split prepend_sys_path on the OS path separator; the legacy default also
# splits on ":", which breaks Windows drive-letter paths.
path_separator = os
sqlalchemy.url = postgresql://unused:unused@localhost/unused

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
